name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      CI: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_NOLOGO: true
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: |
            src/DigiChat.Overlay/package-lock.json
            src/DigiChat.Admin/package-lock.json

      # A green badge must mean the production database path was exercised.
      # Without this the LocalDB integration tests silently auto-skip and CI
      # still passes, which is exactly the ambiguity the runbook forbids.
      - name: Require SQL Server LocalDB
        shell: powershell
        run: |
          $info = & sqllocaldb info
          if ($LASTEXITCODE -ne 0) { throw "sqllocaldb is unavailable; LocalDB integration tests would skip." }
          Write-Host "LocalDB instances: $($info -join ', ')"

      - name: Build, test, and verify public artifact
        shell: powershell
        run: .\scripts\Verify-Repository.ps1
